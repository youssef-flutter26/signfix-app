name: signfix_app
description: SignFix — Sign Board Sales, Service & Technician Management Platform.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/signfix-logo.svg
    - assets/images/logo.jpeg
    - assets/images/banner1.jpeg
    - assets/images/banner2.jpeg
    - assets/images/banner3.jpeg

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  razorpay_flutter: ^1.3.6
  animated_text_kit: ^4.2.2
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
