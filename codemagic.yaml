workflows:
  ios-workflow:
    name: iOS App Store Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.signfix.app
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build IPA without signing
        script: |
          flutter build ipa --release --no-codesign
      - name: Package and Sign IPA
        script: |
          xcode-project package-app --ipa-dir "$CM_BUILD_DIR/build/ios/ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true